name: esim_check
description: Check eSIM support using native APIs (EuiccManager on Android, device model identifier on iOS).
version: 1.2.2
repository: https://github.com/qeepcologne/esim_check
issue_tracker: https://github.com/qeepcologne/esim_check/issues
topics:
  - esim

environment:
  sdk: ^3.13.0
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.qeepcologne.esim_check
        pluginClass: EsimCheckPlugin
      ios:
        pluginClass: EsimCheckPlugin
        sharedDarwinSource: true
